version: 1
owner: ac0033

header:
  title: "YuanLumen's Garage 🛠️"
  taglines:
    - "**构建 AI 工具与产品，记录公开课学习实践。**"
  nav:
    - { text: "AI 工具", anchor: "ai-tools" }
    - { text: "AI 产品", anchor: "ai-products" }
    - { text: "AI 学习", anchor: "ai-learning" }
  stack: "Python · TypeScript · PyTorch · LangGraph · MCP · RAG · Agent Skills"

# 状态枚举 → 展示文本。render 只接受这里的 key，Agent 也禁止自造状态。
status:
  active: "已公开"
  preview: "🔍 公开预览"
  wip: "🚧 待更新中"
  planned: "🔒 未公开"
  archived: "📦 已归档"
  deprecated: "即将下线"

# 已确认暂不展示的公开仓库。其他未收录的公开仓库仍会触发同步提醒。
unlisted_repos:
  - dsflow
  - dsh-ctm
  - Humanizer-zh
  - learning_assistant_agent
  - LLMs-from-scratch
  - white-box-explainer
  - wine-quality

sections:
  - id: ai-tools
    heading: "🛠️ AI 工具"
    blocks:
      - type: html-table
        columns: ["总仓库", "工具", "用途"]
        groups:
          - repo: skills
            rows:
              - repo: product-dev
                text: "面向 Claude Code、Codex、DeepSeek Harness 等 Agent 的产品开发插件，覆盖需求、设计、开发、验证与交付。"

  - id: ai-products
    heading: "🚀 AI 产品"
    blocks: []

  - id: ai-learning
    heading: "📚 AI 学习"
    blocks:
      - type: text
        value: "公开课自学记录、个人作业实现与课程材料整理。按学校与课程展示，具体完成情况见各仓库。"
      - type: html-table
        columns: ["学校", "课程", "仓库与内容"]
        groups:
          - school: "UCB"
            rows:
              - course: "CS 61A · 计算机程序的构造与解释"
                repos:
                  - { repo: cs61a, text: "Python、Scheme、讨论与项目练习" }
              - course: "Data 8 · 数据科学基础"
                repos:
                  - { repo: course-data8, text: "作业、实验与课程项目" }
                  - { repo: materials-sp25, text: "课程材料 fork" }
          - school: "CMU"
            rows:
              - course: "Introduction to Deep Learning"
                repos:
                  - { repo: CMU-IDeeL.github.io, text: "课程网站与历年材料的个人副本" }
          - school: "University of Michigan"
            rows:
              - course: "EECS 498-007 / 598-005 · 深度学习计算机视觉"
                repos:
                  - { repo: course-eecs498-umich, text: "A1–A6 作业实现，覆盖分类、检测、图像描述、Transformer 与生成模型" }
          - school: "Stanford"
            rows:
              - course: "CS224N · 自然语言处理与深度学习"
                repos:
                  - { url: "docs/cs224n.md", label: "查看说明", text: "版权所限，不公开展示" }
      - type: note
        value: "<sub>个人学习仓库不代表课程官方；课程材料、第三方代码与个人实现的来源和许可见各仓库说明。</sub>"

footer:
  text: "持续学习，持续构建，记录可复查的实践。"
