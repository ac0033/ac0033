name: Notify profile repo

# 复制本文件到各项目仓库的 .github/workflows/ 下，
# 即可在 push / release 时近实时通知 ac0033/ac0033 的 sync / remind / ai-update。
#
# 需要在每个项目仓库配置 secret：PROFILE_DISPATCH_TOKEN
#   —— 一个只授权 ac0033/ac0033 仓库 Contents: Read and write 的 fine-grained PAT
#   （或组织级 secret，避免逐仓库配置）

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PROFILE_DISPATCH_TOKEN }}
          repository: ac0033/ac0033
          event-type: repo-updated
          client-payload: '{"repo":"${{ github.event.repository.name }}","event":"${{ github.event_name }}"}'
