name: Remind profile update

# 方案 B：检测到漂移时开 / 更新一个 Issue 提醒，不自动改任何内容。
#
# 排序：本 workflow 早于 sync-auto 运行（03:17 vs 03:27），
# 保证在 sync-auto 提交新快照之前先完成检测，避免漂移被静默刷新。
# 提醒不会自动关闭：首页更新后请手动关闭 issue。

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [repo-updated]

permissions:
  contents: read
  issues: write

concurrency:
  group: profile-remind
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: 采集仓库事实
        run: npm run collect
        env:
          GH_TOKEN: ${{ secrets.PROFILE_PAT }}

      - name: 检测漂移
        run: npm run diff

      - name: 无漂移则结束
        id: gate
        run: echo "drift=$(jq -r .hasDrift drift.json)" >> "$GITHUB_OUTPUT"

      - name: 有漂移：按内容去重，创建或更新 Issue
        if: steps.gate.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create profile-sync --description "GitHub 首页待同步" --color FBCA04 2>/dev/null || true

          # 用漂移项（不含生成时间）的哈希去重，避免每天重复通知
          HASH=$(jq -c '.items' drift.json | sha256sum | cut -d' ' -f1)
          {
            echo "<!-- drift-hash: $HASH -->"
            echo "> 更新首页后请手动关闭本 issue；本提醒不会自动消失。"
            echo
            cat drift.md
          } > .drift-body.md

          num=$(gh issue list --label profile-sync --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            if gh issue view "$num" --json body --jq .body | grep -q "drift-hash: $HASH"; then
              echo "漂移内容未变化，跳过通知"
              exit 0
            fi
            gh issue edit "$num" --body-file .drift-body.md
            echo "已更新 Issue #$num"
          else
            gh issue create \
              --title "首页待同步：$(date -u +%F)" \
              --label profile-sync \
              --body-file .drift-body.md
          fi
